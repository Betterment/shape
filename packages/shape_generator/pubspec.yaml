name: shape_generator
description: The code generator for the shape package. For more information,
  check out the README of the shape package.
version: 0.1.0
repository: https://github.com/betterment/shape/tree/main/packages/shape_generator
resolution: workspace

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  # Stay on analyzer 10.x for Flutter 3.44: its pinned test_core 0.6.17 requires
  # analyzer <13, and build 4.0.8+ requires analyzer >=13.3.
  analyzer: '>=10.0.0 <11.0.0'
  build: '>=4.0.4 <4.0.8'
  meta: ^1.15.0
  path: ^1.9.1
  shape: ^0.1.0
  shape_starter_kit: ^0.1.0
  source_gen: ^4.2.0

dev_dependencies:
  build_runner: '>=2.15.0 <2.15.3'
  build_test: ^3.5.0
  checks: ^0.3.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  package_config: ^2.2.0
  # test 1.31.2+ requires analyzer >=13, we keep this pinned below that
  # for Flutter 3.44 compatibility.
  test: '>=1.25.0 <1.31.2'
