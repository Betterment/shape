name: shape_example
description: An example project showcasing how to build a form body using the shape package.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  shape: ^0.1.0
  shape_starter_kit: ^0.1.0

dev_dependencies:
  build_runner: '>=2.15.0 <2.15.3'
  checks: ^0.3.1
  lints: ^6.1.0
  shape_generator: ^0.1.0
  # test 1.31.2+ requires analyzer >=13; keep below that for Flutter 3.44.
  test: '>=1.25.0 <1.31.2'
